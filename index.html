<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>March Music Madness</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e10; --surface: #18181c; --surface2: #222228;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
    --text: #f0efe8; --muted: rgba(240,239,232,0.45); --hint: rgba(240,239,232,0.25);
    --green: #1DB954; --green-dim: rgba(29,185,84,0.15); --accent: #c8b97a;
  }
  body { background: var(--bg); color: var(--text); font-family: "DM Sans", sans-serif; font-weight: 400; min-height: 100vh; overflow-x: hidden; }
  header { padding: 2rem 2.5rem 1.5rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: baseline; gap: 1rem; }
  header h1 { font-family: "Instrument Serif", serif; font-size: 28px; font-weight: 400; letter-spacing: -0.01em; }
  header .tagline { font-size: 13px; color: var(--muted); }
  .screen { display: none; }
  .screen.active { display: block; }
  #setup-screen { padding: 2.5rem; max-width: 600px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .search-row input { flex: 1; background: var(--surface); border: 0.5px solid var(--border2); border-radius: 8px; padding: 10px 14px; font-family: "DM Sans", sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.15s; }
  .search-row input::placeholder { color: var(--hint); }
  .search-row input:focus { border-color: rgba(255,255,255,0.3); }
  .search-row button { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 10px 18px; color: var(--text); font-family: "DM Sans", sans-serif; font-size: 14px; cursor: pointer; transition: background 0.15s; }
  .search-row button:hover { background: rgba(255,255,255,0.08); }
  .artist-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 1rem; }
  .artist-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: border-color 0.15s, background 0.15s; }
  .artist-card:hover { border-color: var(--border2); background: var(--surface2); }
  .artist-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
  .artist-initials { width: 42px; height: 42px; border-radius: 50%; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: var(--muted); }
  .artist-name { font-size: 13px; font-weight: 500; }
  .artist-listeners { font-size: 11px; color: var(--muted); margin-top: 1px; }
  #status-msg { font-size: 13px; color: var(--muted); margin-top: 8px; }
  #error-msg { font-size: 13px; color: #e05c5c; margin-top: 8px; display: none; }
  #bracket-screen { padding: 1.5rem 2rem; }
  .bracket-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .bracket-header h2 { font-family: "Instrument Serif", serif; font-size: 22px; font-weight: 400; }
  .back-btn { background: none; border: 0.5px solid var(--border2); border-radius: 8px; padding: 6px 12px; color: var(--muted); font-family: "DM Sans", sans-serif; font-size: 12px; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
  .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  #champion-area { display: none; }
  .champion-card { background: linear-gradient(135deg, rgba(200,185,122,0.12), rgba(200,185,122,0.04)); border: 0.5px solid rgba(200,185,122,0.35); border-radius: 16px; padding: 2rem; text-align: center; max-width: 360px; margin: 0 auto 2.5rem; }
  .champion-card .trophy { font-size: 36px; margin-bottom: 0.75rem; }
  .champion-card .champ-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
  .champion-card .champ-name { font-family: "Instrument Serif", serif; font-size: 24px; color: var(--text); }
  .champion-card .champ-artist { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .bracket-wrap { display: flex; gap: 0; align-items: flex-start; overflow-x: auto; padding-bottom: 1.5rem; -webkit-overflow-scrolling: touch; }
  .round-col { display: flex; flex-direction: column; min-width: 190px; flex-shrink: 0; }
  .round-title { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hint); text-align: center; padding: 0 8px 10px; }
  .round-matches { display: flex; flex-direction: column; }
  .match-cell { display: flex; align-items: center; padding: 4px 6px; }
  .match-block { width: 172px; }
  .song-slot { background: var(--surface); border: 0.5px solid var(--border); padding: 8px 10px; font-size: 12px; cursor: pointer; line-height: 1.3; min-height: 40px; display: flex; align-items: center; transition: background 0.12s, border-color 0.12s; position: relative; overflow: hidden; }
  .song-slot:first-child { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }
  .song-slot + .song-slot { border-radius: 0 0 6px 6px; }
  .song-slot:not(.empty):not(.loser):not([data-decided]):hover { background: var(--surface2); border-color: var(--border2); }
  .song-slot.winner { background: var(--green-dim); border-color: rgba(29,185,84,0.4) !important; color: #1DB954; font-weight: 500; }
  .song-slot.loser { opacity: 0.3; cursor: pointer; }
  .song-slot.empty { color: var(--hint); cursor: default; font-style: italic; font-size: 11px; }
  .song-slot .seed { font-size: 9px; color: var(--hint); margin-right: 5px; flex-shrink: 0; width: 14px; text-align: right; }
  .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 108px; display: inline-block; flex: 1; }
  .play-btn { width: 20px; height: 20px; border-radius: 50%; border: 0.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-left: 5px; transition: background 0.12s, border-color 0.12s; font-size: 8px; padding: 0; }
  .play-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
  .play-btn.playing { background: var(--green-dim); border-color: rgba(29,185,84,0.5); color: var(--green); }
  .song-slot.winner .play-btn { border-color: rgba(29,185,84,0.4); color: #1DB954; }
  .connector-col { display: flex; flex-direction: column; width: 20px; flex-shrink: 0; }
  @media (max-width: 768px) {
    header { padding: 1rem 1.25rem 0.75rem; }
    header h1 { font-size: 22px; }
    header .tagline { display: none; }
    #setup-screen { padding: 1.25rem; }
    #bracket-screen { padding: 0.75rem 0.5rem; }
    .bracket-header { margin-bottom: 1rem; }
    .bracket-wrap { padding-bottom: 1rem; }
    .round-col { min-width: 160px; }
    .match-block { width: 142px; }
    .song-name { max-width: 88px; }
    .song-slot { padding: 7px 8px; font-size: 11px; min-height: 38px; }
    .song-slot .seed { width: 12px; margin-right: 4px; }
    .play-btn { width: 18px; height: 18px; font-size: 7px; margin-left: 3px; }
    .round-title { font-size: 9px; padding: 0 4px 8px; }
    .artist-results { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .champion-card { padding: 1.25rem; }
  }
</style>
</head>
<body>
<header>
  <h1>March Music Madness</h1>
  <span class="tagline">tournament bracket for any artist</span>
</header>

<div id="setup-screen" class="screen active">
  <p style="font-size:14px;color:var(--muted);margin-bottom:1.25rem;">Search for any artist to build a bracket from their top 32 songs.</p>
  <div class="search-row">
    <input type="text" id="artist-input" placeholder="Search for an artist..." onkeydown="if(event.key==='Enter') searchArtists()" autofocus />
    <button onclick="searchArtists()">Search</button>
  </div>
  <div id="error-msg"></div>
  <div id="status-msg"></div>
  <div id="artist-results" class="artist-results"></div>
</div>

<div id="bracket-screen" class="screen">
  <div class="bracket-header">
    <button class="back-btn" onclick="resetApp()">&#8592; New bracket</button>
    <h2 id="bracket-title"></h2>
  </div>
  <div id="champion-area"></div>
  <div id="bracket-wrap" class="bracket-wrap"></div>
</div>

<script>
const LASTFM_KEY = 'c8cb91be62dcc59e2c73c960190a0b1c';
const LASTFM = 'https://ws.audioscrobbler.com/2.0/';
let bracket = [];
let artistName = '';

async function searchArtists() {
  const q = document.getElementById('artist-input').value.trim();
  if (!q) return;
  setStatus('Searching...');
  setError('');
  document.getElementById('artist-results').innerHTML = '';
  try {
    const url = LASTFM + '?method=artist.search&artist=' + encodeURIComponent(q) + '&api_key=' + LASTFM_KEY + '&format=json&limit=6';
    const res = await fetch(url);
    const data = await res.json();
    setStatus('');
    const artists = data.results && data.results.artistmatches && data.results.artistmatches.artist || [];
    renderArtists(Array.isArray(artists) ? artists : [artists]);
  } catch(e) {
    setError('Search failed: ' + e.message);
    setStatus('');
  }
}

function renderArtists(artists) {
  const c = document.getElementById('artist-results');
  if (!artists.length) { c.innerHTML = '<p style="color:var(--muted);font-size:14px;">No artists found.</p>'; return; }
  c.innerHTML = '';
  artists.forEach(function(a) {
    const imgArr = Array.isArray(a.image) ? a.image : [];
    const imgObj = imgArr.find(function(i) { return i.size === 'medium'; }) || imgArr[0];
    const imgUrl = imgObj ? imgObj['#text'] : '';
    const listeners = a.listeners ? parseInt(a.listeners).toLocaleString() + ' listeners' : '';
    const initial = a.name ? a.name[0].toUpperCase() : '?';
    const card = document.createElement('div');
    card.className = 'artist-card';
    card.onclick = (function(name) { return function() { selectArtist(name); }; })(a.name);
    if (imgUrl) {
      const img = document.createElement('img');
      img.className = 'artist-img';
      img.src = imgUrl;
      const fallback = document.createElement('div');
      fallback.className = 'artist-initials';
      fallback.style.display = 'none';
      fallback.textContent = initial;
      img.onerror = function() { img.style.display = 'none'; fallback.style.display = 'flex'; };
      card.appendChild(img);
      card.appendChild(fallback);
    } else {
      const initDiv = document.createElement('div');
      initDiv.className = 'artist-initials';
      initDiv.textContent = initial;
      card.appendChild(initDiv);
    }
    const info = document.createElement('div');
    const nameDiv = document.createElement('div');
    nameDiv.className = 'artist-name';
    nameDiv.textContent = a.name;
    const lisDiv = document.createElement('div');
    lisDiv.className = 'artist-listeners';
    lisDiv.textContent = listeners;
    info.appendChild(nameDiv);
    info.appendChild(lisDiv);
    card.appendChild(info);
    c.appendChild(card);
  });
}

async function selectArtist(name) {
  artistName = name;
  setStatus('Loading top tracks for ' + name + '...');
  document.getElementById('artist-results').innerHTML = '';
  try {
    // Fetch Last.fm top tracks
    const url = LASTFM + '?method=artist.gettoptracks&artist=' + encodeURIComponent(name) + '&api_key=' + LASTFM_KEY + '&format=json&limit=50';
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.message);
    const tracks = (data.toptracks && data.toptracks.track) || [];
    if (tracks.length < 2) { setError('Not enough tracks found. Try another artist.'); setStatus(''); return; }

    // Deduplicate by base title
    const seenBase = {};
    const dedupedTracks = [];
    const skipNames = ['intro', 'outro', 'interlude', 'skit'];
    tracks.forEach(function(t) {
      const base = t.name.toLowerCase().replace(/\s*[-\(].*$/, '').trim();
      if (!seenBase[base] && !skipNames.includes(base)) { seenBase[base] = true; dedupedTracks.push(t); }
    });

    const sizes = [2,4,8,16,32];
    const size = sizes.find(function(s) { return s >= Math.min(dedupedTracks.length, 32); }) || 32;
    const songs = dedupedTracks.slice(0, size).map(function(t, i) { return { id: i, name: t.name }; });
    while (songs.length < size) songs.push({ id: songs.length, name: 'BYE', bye: true });

    // Pre-fetch iTunes catalog for this artist in background
    setStatus('Loading previews...');
    await prefetchItunesCatalog(name);

    setStatus('');
    startBracket(songs);
  } catch(e) {
    setError('Could not load tracks: ' + e.message);
    setStatus('');
  }
}

async function prefetchItunesCatalog(artist) {
  try {
    // Step 1: get iTunes artist ID
    const q = encodeURIComponent(artist);
    const r1 = await fetch('https://itunes.apple.com/search?term=' + q + '&entity=musicArtist&limit=5');
    const d1 = await r1.json();
    const artistMatch = d1.results && d1.results.find(function(r) {
      return r.artistName && r.artistName.toLowerCase() === artist.toLowerCase();
    }) || (d1.results && d1.results[0]);
    if (!artistMatch || !artistMatch.artistId) return;

    // Step 2: fetch all tracks for that artist ID
    const r2 = await fetch('https://itunes.apple.com/lookup?id=' + artistMatch.artistId + '&entity=song&limit=200');
    const d2 = await r2.json();
    const results = d2.results || [];

    // Step 3: build preview map keyed by normalized track name
    const badWords = ['live', 'acoustic', 'demo', 'karaoke', 'instrumental'];
    results.forEach(function(r) {
      if (!r.previewUrl || !r.trackName) return;
      const key = r.trackName.toLowerCase().replace(/\s*[-\(].*$/, '').trim();
      // Only store if not already cached with a clean version
      if (!itunesCache[key] || badWords.some(function(w) {
        return (itunesCache[key + '__name'] || '').indexOf(w) !== -1;
      })) {
        const trackLower = r.trackName.toLowerCase();
        const isBad = badWords.some(function(w) { return trackLower.indexOf(w) !== -1 || (r.collectionName || '').toLowerCase().indexOf(w) !== -1; });
        if (!itunesCache[key] || !isBad) {
          itunesCache[key] = r.previewUrl;
          itunesCache[key + '__name'] = r.trackName.toLowerCase();
        }
      }
    });
  } catch(e) {
    // Silent fail — previews just won't work
  }
}

function buildSeededOrder(n) {
  if (n === 2) return [0, 1];
  const prev = buildSeededOrder(n / 2);
  const result = [];
  for (let i = 0; i < prev.length; i++) {
    result.push(prev[i]);
    result.push(n - 1 - prev[i]);
  }
  return result;
}

function startBracket(songs) {
  const size = songs.length;
  const numRounds = Math.log2(size);
  const order = buildSeededOrder(size);
  const pairs = [];
  for (let i = 0; i < order.length; i += 2) pairs.push([songs[order[i]], songs[order[i+1]]]);
  bracket = [pairs.map(function(p, i) { return { id: i, songs: [p[0], p[1]], winner: null }; })];
  for (let r = 1; r < numRounds; r++) {
    const prev = bracket[r-1];
    bracket.push(prev.map(function(_, i) { return i % 2 === 0 ? { id: i/2, songs: [null, null], winner: null } : null; }).filter(Boolean));
  }
  bracket[0].forEach(function(match, mi) {
    if (match.songs[0] && match.songs[0].bye && match.songs[1] && !match.songs[1].bye) advanceWinner(0, mi, match.songs[1]);
    else if (match.songs[1] && match.songs[1].bye && match.songs[0] && !match.songs[0].bye) advanceWinner(0, mi, match.songs[0]);
    else if (match.songs[0] && match.songs[0].bye && match.songs[1] && match.songs[1].bye) match.winner = match.songs[0];
  });
  document.getElementById('setup-screen').classList.remove('active');
  document.getElementById('bracket-screen').classList.add('active');
  document.getElementById('bracket-title').textContent = artistName;
  renderBracket();
}

function advanceWinner(roundIdx, matchIdx, winner) {
  const match = bracket[roundIdx][matchIdx];
  if (match.winner) return;
  match.winner = winner;
  if (roundIdx + 1 < bracket.length) {
    bracket[roundIdx + 1][Math.floor(matchIdx / 2)].songs[matchIdx % 2] = winner;
  }
}

function clearDownstream(roundIdx, matchIdx) {
  // Recursively clear winner and downstream results from this match onwards
  if (roundIdx >= bracket.length) return;
  const match = bracket[roundIdx][matchIdx];
  if (!match) return;
  const prevWinner = match.winner;
  match.winner = null;
  // Clear the slot this match feeds into in the next round
  if (roundIdx + 1 < bracket.length) {
    const ni = Math.floor(matchIdx / 2);
    const ns = matchIdx % 2;
    const nextMatch = bracket[roundIdx + 1][ni];
    if (nextMatch && nextMatch.songs[ns] && prevWinner && nextMatch.songs[ns].id === prevWinner.id) {
      nextMatch.songs[ns] = null;
      clearDownstream(roundIdx + 1, ni);
    }
  }
}

function pickWinner(roundIdx, matchIdx, slotIdx) {
  const match = bracket[roundIdx][matchIdx];
  const clicked = match.songs[slotIdx];
  if (!clicked || clicked.bye) return;

  // If clicking the current winner, undo it
  if (match.winner && match.winner.id === clicked.id) {
    clearDownstream(roundIdx, matchIdx);
    renderBracket();
    return;
  }

  // If match already has a winner (switching pick), clear downstream first
  if (match.winner) clearDownstream(roundIdx, matchIdx);

  advanceWinner(roundIdx, matchIdx, clicked);
  if (roundIdx + 1 < bracket.length) {
    const ni = Math.floor(matchIdx / 2);
    const ns = matchIdx % 2;
    const opp = bracket[roundIdx + 1][ni].songs[ns === 0 ? 1 : 0];
    if (opp && opp.bye) setTimeout(function() { advanceWinner(roundIdx + 1, ni, clicked); renderBracket(); }, 80);
  }
  renderBracket();
}

let currentAudio = null;
let currentPlayBtn = null;
const itunesCache = {};

async function togglePreview(e, songName, artist, btn) {
  e.stopPropagation();
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
    if (currentPlayBtn) { currentPlayBtn.classList.remove('playing'); currentPlayBtn.innerHTML = '&#9654;'; }
    if (currentPlayBtn === btn) { currentPlayBtn = null; return; }
  }
  currentPlayBtn = btn;
  btn.innerHTML = '...';
  // Look up from pre-fetched catalog by normalized track name
  const normalizedSong = songName.toLowerCase().replace(/\s*[-\(].*$/, '').trim();
  let previewUrl = itunesCache.hasOwnProperty(normalizedSong) ? itunesCache[normalizedSong] : undefined;
  if (previewUrl === undefined) previewUrl = null;
  if (!previewUrl) {
    btn.innerHTML = '&#8709;';
    btn.title = 'No preview available';
    currentPlayBtn = null;
    return;
  }
  btn.classList.add('playing');
  btn.innerHTML = '&#9646;&#9646;';
  currentAudio = new Audio(previewUrl);
  currentAudio.volume = 0.8;
  currentAudio.play();
  currentAudio.onended = function() {
    btn.classList.remove('playing');
    btn.innerHTML = '&#9654;';
    currentAudio = null;
    currentPlayBtn = null;
  };
}

function renderBracket() {
  const wrap = document.getElementById('bracket-wrap');
  const champArea = document.getElementById('champion-area');
  wrap.innerHTML = '';
  const roundNames = ['Round of 32','Round of 16','Quarterfinals','Semifinals','Final'];
  const totalRounds = bracket.length;
  const finalMatch = bracket[totalRounds - 1][0];
  if (finalMatch && finalMatch.winner && !finalMatch.winner.bye) {
    champArea.style.display = 'block';

    // Find 2nd place: the loser of the final
    const finalist = finalMatch.songs.find(function(s) { return s && !s.bye && s.id !== finalMatch.winner.id; });

    // Find 3rd/4th: losers of the two semifinals
    const semis = bracket.length >= 2 ? bracket[bracket.length - 2] : [];
    const thirdFourth = [];
    semis.forEach(function(m) {
      if (m && m.winner) {
        const loser = m.songs.find(function(s) { return s && !s.bye && s.id !== m.winner.id; });
        if (loser) thirdFourth.push(loser);
      }
    });

    function placeRow(rank, song) {
      if (!song || song.bye) return '';
      const medals = ['&#127942;', '&#129352;', '&#129353;', '&#129354;'];
      const sizes = ['24px', '16px', '15px', '15px'];
      const opacities = ['1', '0.85', '0.7', '0.7'];
      return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-top:0.5px solid rgba(255,255,255,0.06);opacity:' + opacities[rank-1] + '">' +
        '<span style="font-size:' + sizes[rank-1] + ';flex-shrink:0;">' + medals[rank-1] + '</span>' +
        '<div style="text-align:left;">' +
        '<div style="font-size:' + (rank === 1 ? '18px' : '13px') + ';font-weight:500;color:var(--text);">' + esc(song.name) + '</div>' +
        '<div style="font-size:10px;color:var(--hint);">seed ' + (song.id + 1) + '</div>' +
        '</div></div>';
    }

    let placesHtml = placeRow(1, finalMatch.winner);
    if (finalist) placesHtml += placeRow(2, finalist);
    thirdFourth.forEach(function(s, i) { placesHtml += placeRow(3 + i, s); });

    champArea.innerHTML = '<div class="champion-card" style="max-width:320px;">' +
      '<div class="champ-label" style="margin-bottom:1rem;">Final standings &mdash; ' + esc(artistName) + '</div>' +
      placesHtml + '</div>';
  } else {
    champArea.style.display = 'none';
  }
  for (let r = 0; r < totalRounds; r++) {
    const col = document.createElement('div');
    col.className = 'round-col';
    col.innerHTML = '<div class="round-title">' + (roundNames[Math.min(r, roundNames.length-1)]) + '</div>';
    const matchesDiv = document.createElement('div');
    matchesDiv.className = 'round-matches';
    const slotH = Math.max(40, Math.floor(560 / Math.pow(2, totalRounds - r)));
    bracket[r].forEach(function(match, mi) {
      const cell = document.createElement('div');
      cell.className = 'match-cell';
      cell.style.height = (slotH * 2 + 8) + 'px';
      const block = document.createElement('div');
      block.className = 'match-block';
      [0, 1].forEach(function(si) {
        const song = match.songs[si];
        const slot = document.createElement('div');
        slot.className = 'song-slot';
        if (!song) {
          slot.classList.add('empty');
          slot.innerHTML = '<span>TBD</span>';
        } else if (song.bye) {
          slot.classList.add('empty');
          slot.innerHTML = '<span>&#8212;</span>';
        } else {
          slot.style.cursor = 'pointer';
          slot.onclick = (function(r2, mi2, si2) { return function() { pickWinner(r2, mi2, si2); }; })(r, mi, si);
          if (match.winner) {
            slot.classList.add(match.winner.id === song.id ? 'winner' : 'loser');
          }
          const seedSpan = document.createElement('span');
          seedSpan.className = 'seed';
          seedSpan.textContent = song.id + 1;
          const nameSpan = document.createElement('span');
          nameSpan.className = 'song-name';
          nameSpan.title = song.name;
          nameSpan.textContent = song.name;
          const playBtn = document.createElement('button');
          playBtn.className = 'play-btn';
          playBtn.title = 'Preview';
          playBtn.innerHTML = '&#9654;';
          playBtn.onclick = (function(sName, aName, b) {
            return function(e) { togglePreview(e, sName, aName, b); };
          })(song.name, artistName, playBtn);
          slot.appendChild(seedSpan);
          slot.appendChild(nameSpan);
          slot.appendChild(playBtn);
        }
        block.appendChild(slot);
      });
      cell.appendChild(block);
      matchesDiv.appendChild(cell);
    });
    col.appendChild(matchesDiv);
    wrap.appendChild(col);
    if (r < totalRounds - 1) {
      const connCol = document.createElement('div');
      connCol.className = 'connector-col';
      connCol.innerHTML = '<div class="round-title" style="opacity:0;">-</div>';
      const connMatches = document.createElement('div');
      connMatches.style.cssText = 'display:flex;flex-direction:column;flex:1;';
      bracket[r].forEach(function(_, mi) {
        if (mi % 2 === 0) {
          const h = (slotH * 2 + 8) * 2;
          const pair = document.createElement('div');
          pair.style.cssText = 'height:' + h + 'px;display:flex;align-items:center;';
          pair.innerHTML = '<svg height="' + h + '" viewBox="0 0 20 ' + h + '" fill="none"><path d="M0 ' + (h/4) + ' H10 V' + (h*3/4) + ' H0" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" fill="none"/><path d="M10 ' + (h/2) + ' H20" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></svg>';
          connMatches.appendChild(pair);
        }
      });
      connCol.appendChild(connMatches);
      wrap.appendChild(connCol);
    }
  }
}

function resetApp() {
  bracket = []; artistName = '';
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentPlayBtn = null;
  Object.keys(itunesCache).forEach(function(k) { delete itunesCache[k]; });
  document.getElementById('bracket-screen').classList.remove('active');
  document.getElementById('setup-screen').classList.add('active');
  document.getElementById('artist-results').innerHTML = '';
  document.getElementById('artist-input').value = '';
  document.getElementById('champion-area').style.display = 'none';
  setStatus(''); setError('');
  setTimeout(function() { document.getElementById('artist-input').focus(); }, 50);
}

function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }
function setError(msg) { var el = document.getElementById('error-msg'); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
</body>
